<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isabel, Mi Universo 🌻✨</title>

    <!-- Librerías Externas CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Librerías Externas JavaScript (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <!-- Contenedor WebGL 3D -->
    <div id="webgl-container"></div>

    <!-- Cartel de Pausa de Espacio -->
  

    <!-- Contenedor de Lluvia de Cariño -->
    <div id="shower-box"></div>

    <!-- Capa de Interfaz de Usuario -->
    <div class="ui-overlay">
        <!-- SECCIÓN SUPERIOR -->
        <div class="top-section">
            <div class="glass-panel title-panel interactive-element">
                <h1 class="app-title">
                    <i class="fa-solid fa-sun me-2"></i>
                    Isabel, mi universo 🌻✨
                </h1>
                <p class="subtitle">
                    Toca en cualquier parte del espacio para pausar la rotación.
                </p>
                <p class="love-text">
                    Entre infinitas órbitas y miles de estrellas centelleantes, encontrarte a ti fue mi coincidencia favorita. Te quiero con toda el alma, mi amor. ❤️
                </p>
            </div>

            <div class="top-buttons">
                <!-- Botón de Reproducción de Música -->
                <button id="btn-audio" class="btn btn-cosmic interactive-element" onclick="toggleAudio()">
                    <i class="fa-solid fa-compact-disc me-2" id="audio-icon"></i>
                    <span id="audio-status-text">Reproducir Música</span>
                </button>
            </div>
        </div>

        <!-- SECCIÓN INFERIOR -->
        <div class="bottom-section">
            <div class="interactive-element">
                <button class="btn btn-outline-cosmic" id="btn-toggle-shower" onclick="toggleShower(event)">
                    <i class="fa-solid fa-pause me-1"></i>
                    <span id="shower-btn-text">Pausar Lluvia</span>
                </button>
            </div>

                    </div>
    </div>

    <script src="js/espacio.js"></script>
</body>
</html>
